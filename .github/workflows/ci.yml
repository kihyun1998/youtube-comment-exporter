name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci runs the `wxt prepare` postinstall, which generates the
      # .wxt/ types that the type check below depends on.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
